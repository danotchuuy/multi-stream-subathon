# Example Kubernetes manifests for multi-stream-subathon.
#
# The server persists everything — timer state, contributor events,
# accounts, linked platform identities, and sessions — to a single
# SQLite file at DB_PATH (see internal/sqlite and the Dockerfile's
# VOLUME ["/data"]), so it's deployed as a single-replica StatefulSet
# with a per-pod PersistentVolumeClaim rather than a Deployment — state
# lives on local disk, not in any shared/replicated store, so replicas
# don't scale horizontally and each pod's data must follow that pod
# across restarts.
#
# Usage:
#   1. Fill in the Secret below with real OAuth/webhook credentials (or
#      better, generate it out-of-band and never commit real values):
#        kubectl create secret generic multi-stream-subathon-secrets \
#          --from-literal=TWITCH_CLIENT_ID=... \
#          --from-literal=TWITCH_CLIENT_SECRET=... \
#          --from-literal=TWITCH_WEBHOOK_SECRET=$(openssl rand -hex 16) \
#          --from-literal=KICK_CLIENT_ID=... \
#          --from-literal=KICK_CLIENT_SECRET=... \
#          --from-literal=STREAMELEMENTS_CLIENT_ID=... \
#          --from-literal=STREAMELEMENTS_CLIENT_SECRET=...
#      (Each timer owner still connects their own StreamElements account
#      individually, from that timer's dashboard — but doing so now goes
#      through this server's own registered OAuth2 app, replacing the
#      old flow of pasting in a personal JWT token, so it needs this
#      credential to exist at all.)
#   2. Update the ConfigMap's PUBLIC_BASE_URL to match wherever you
#      expose the Service (Ingress host, etc) — ALLOWED_ORIGIN,
#      COOKIE_SECURE, and every provider's *_REDIRECT_URL all derive from
#      it automatically (see internal/config.Load), so that one value is
#      usually all you need to change.
#   3. Update `image:` to your pushed tag (see `make docker-push`).
#   4. kubectl apply -f k8s/deployment.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-stream-subathon-config
  labels:
    app: multi-stream-subathon
data:
  ADDR: ":8080"
  # Baked into the image already, set explicitly here for clarity.
  UI_DIST_DIR: /app/frontend/dist
  DB_PATH: /data/subathon.db
  # The single origin the app is served under. ALLOWED_ORIGIN,
  # COOKIE_SECURE, and the Twitch/Kick/StreamElements redirect URLs all
  # default from this — register <PUBLIC_BASE_URL>/auth/twitch/callback,
  # <PUBLIC_BASE_URL>/auth/kick/callback, and
  # <PUBLIC_BASE_URL>/auth/streamelements/callback with each OAuth app.
  # Replace with your real hostname.
  PUBLIC_BASE_URL: "https://subathon.danotchuuy.com"
  # Fallback clock length if not set on reset; override if you want a
  # different default than the 1h built into internal/config.
  INITIAL_DURATION: "1h"

---
# Headless (clusterIP: None): required so the StatefulSet can give its
# pod a stable DNS identity, and sufficient here since there's only ever
# one replica — no load-balancing behavior would be gained from a normal
# ClusterIP Service. Put an Ingress or LoadBalancer Service in front of
# this for external access.
apiVersion: v1
kind: Service
metadata:
  name: multi-stream-subathon
  labels:
    app: multi-stream-subathon
spec:
  type: ClusterIP
  selector:
    app: multi-stream-subathon
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: multi-stream-subathon
  labels:
    app: multi-stream-subathon
spec:
  serviceName: multi-stream-subathon
  replicas: 1
  selector:
    matchLabels:
      app: multi-stream-subathon
  template:
    metadata:
      labels:
        app: multi-stream-subathon
    spec:
      # Matches the distroless nonroot runtime image (USER nonroot:nonroot,
      # uid/gid 65532) — see the Dockerfile's runtime stage.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: server
          image: danotchuuy/multi-stream-subathon:2026.09.03-0510
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: multi-stream-subathon-config
            - secretRef:
                name: multi-stream-subathon-secrets
          volumeMounts:
            - name: multi-stream-subathon-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: multi-stream-subathon-data
      spec:
        storageClassName: freenas-iscsi-ssd
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-stream-subathon
  annotations:
    kubernetes.io/ingress.class: "cloudflare-tunnel"
spec:
  rules:
    - host: subathon.danotchuuy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multi-stream-subathon
                port:
                  number: 8080
